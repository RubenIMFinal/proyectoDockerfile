version: '3.8'

services:
  service1:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./app:/usr/share/nginx/html
    networks:
      - frontend_network

  service2:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mydb
    networks:
      - backend_network
    volumes:
      - my_volume:/var/lib/mysql

networks:
  frontend_network:
    driver: bridge

  backend_network:
    driver: bridge

volumes:
  my_volume:

